# macOS Ghostty config.
# This is the entry point on Darwin: symlink ~/.config/ghostty/config -> here.

config-file = ~/.gsync/ghostty/common.conf

font-size = 12

# --- Keybindings -----------------------------------------------------------
# WezTerm mapping on macOS:
#   super_key = SUPER (cmd)
#   ctrl_key  = CTRL
#   meta_key  = META  (option/alt)
#
# Copy / paste
keybind = cmd+c=copy_to_clipboard
keybind = cmd+v=paste_from_clipboard

# Splits (WezTerm: cmd+_ vertical, cmd+| horizontal).
# Ghostty's `new_split` directions describe where the new pane lands.
# WezTerm SplitVertical = stack top/bottom -> Ghostty `down`.
# WezTerm SplitHorizontal = side-by-side    -> Ghostty `right`.
keybind = cmd+shift+minus=new_split:down
keybind = cmd+shift+backslash=new_split:right

# Pane navigation (vim-style).
keybind = cmd+h=goto_split:left
keybind = cmd+l=goto_split:right
keybind = cmd+j=goto_split:bottom
keybind = cmd+k=goto_split:top

# Zoom current pane (WezTerm: alt+f).
keybind = alt+f=toggle_split_zoom

# Windows
keybind = cmd+n=new_window

# Tabs
keybind = cmd+t=new_tab
keybind = cmd+left=previous_tab
keybind = cmd+right=next_tab
keybind = cmd+shift+left=move_tab:-1
keybind = cmd+shift+right=move_tab:1
