# Common Ghostty config shared across platforms.
# Platform-specific files (darwin.conf, linux.conf) include this and add
# OS-specific font size + keybindings.
#
# Reference: https://ghostty.org/docs/config
# Browse themes: `ghostty +list-themes`

# Look and feel
theme = CLRS
font-family = Fira Code

# Horizontal window padding (pixels, each side). Bumped above the default of 2
# so Slack screen-share's green border doesn't clip the leftmost character.
window-padding-x = 6

# Scrollback buffer size in bytes (not lines). Ghostty default is 10MB;
# bump to 100MB for long-running shells with verbose output.
scrollback-limit = 104857600

# Bell: no audio, keep a visual cue + dock-bounce / window attention.
# The richer per-tab bell tracking from the wezterm config is omitted.
bell-features = no-audio,attention,title

# Mouse selection -> clipboard, matching wezterm's CompleteSelection on
# left-click release.
copy-on-select = clipboard

# Don't prompt before pasting multi-line text.
clipboard-paste-protection = false

# Disable update prompts.
auto-update = off

# Send ESC + CR for shift+enter (alt-enter style "newline without submit",
# used by some REPLs and chat CLIs).
keybind = shift+enter=text:"\x1b\r"

# Scroll the scrollback buffer by page.
keybind = shift+page_up=scroll_page_up
keybind = shift+page_down=scroll_page_down
