# Linux Ghostty config.
# This is the entry point on Linux: symlink ~/.config/ghostty/config -> here.
#
# WezTerm Linux mapping swapped super_key=CTRL, ctrl_key=SUPER. We keep that
# convention here so muscle memory carries over: tab/split/window actions
# live on Ctrl+<key>, and Super+<letter> sends a literal Ctrl+<letter> to
# the running program (so e.g. Ctrl+C can be "copy" while Super+C is SIGINT).

config-file = ~/.gsync/ghostty/common.conf

font-size = 14

# --- Keybindings -----------------------------------------------------------

# Copy / paste
keybind = ctrl+c=copy_to_clipboard
keybind = ctrl+v=paste_from_clipboard

# Splits
keybind = ctrl+shift+minus=new_split:down
keybind = ctrl+shift+backslash=new_split:right

# Pane navigation (vim-style).
keybind = ctrl+h=goto_split:left
keybind = ctrl+l=goto_split:right
keybind = ctrl+j=goto_split:bottom
keybind = ctrl+k=goto_split:top

# Zoom current pane.
keybind = alt+f=toggle_split_zoom

# Windows
keybind = ctrl+n=new_window

# Tabs
keybind = ctrl+t=new_tab
keybind = ctrl+left=previous_tab
keybind = ctrl+right=next_tab
keybind = ctrl+shift+left=move_tab:-1
keybind = ctrl+shift+right=move_tab:1

# Send literal Ctrl+<letter> to the shell via Super+<letter>, since the
# Ctrl+letter combos above are bound to terminal actions (copy/tabs/etc).
# Bytes are the standard control codes: ^A=0x01, ^C=0x03, ^D=0x04, ^E=0x05,
# ^L=0x0c.
keybind = super+a=text:"\x01"
keybind = super+c=text:"\x03"
keybind = super+d=text:"\x04"
keybind = super+e=text:"\x05"
keybind = super+l=text:"\x0c"
